name: Procesar datos ChileCompra

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reiniciar desde cero (ignorar progreso anterior)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      start_year:
        description: 'Año inicial del periodo'
        required: false
        default: '2015'
      end_year:
        description: 'Año final del periodo'
        required: false
        default: '2026'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar progreso de ejecucion anterior
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            data/processed/monthly
            data/processed/_progress.json
          key: chilecompra-progress-${{ github.run_id }}
          restore-keys: |
            chilecompra-progress-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar procesador
        run: |
          ARGS="--start-year ${{ github.event.inputs.start_year }} --end-year ${{ github.event.inputs.end_year }}"
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            ARGS="--reset $ARGS"
          fi
          python chilecompra_processor.py $ARGS

      - name: Listar archivos generados
        run: |
          echo "=== Archivos consolidados ==="
          ls -lh data/processed/*.parquet data/processed/*.json 2>/dev/null || echo "Sin archivos finales"
          echo ""
          echo "=== Meses procesados ==="
          TOTAL=$(ls data/processed/monthly/ 2>/dev/null | wc -l)
          echo "$TOTAL meses en cache"

      - name: Publicar release con los archivos Parquet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-$(date +%Y-%m-%d)"

          # Eliminar release existente del mismo dia si lo hay
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true

          RECORDS=$(python -c "
          import json, pathlib
          p = pathlib.Path('data/processed/_progress.json')
          if p.exists():
              d = json.loads(p.read_text())
              print(f\"{d.get('total_records', 0):,}\")
          else:
              print('N/A')
          " 2>/dev/null || echo "N/A")

          MONTHS=$(ls data/processed/monthly/ 2>/dev/null | wc -l || echo "0")

          NOTES=$(cat <<EOF
          ## Datos procesados de licitaciones publicas de Chile

          Generados automaticamente desde [Datos Abiertos ChileCompra](https://datos-abiertos.chilecompra.cl/).

          | Detalle | Valor |
          |---------|-------|
          | Meses procesados | $MONTHS / 136 |
          | Registros totales | $RECORDS |
          | Periodo | 2015 - 2026 |
          | Fecha de generacion | $(date +%Y-%m-%d) |

          ### Archivos incluidos

          | Archivo | Descripcion |
          |---------|-------------|
          | \`agregado_mensual_categoria.parquet\` | Gasto mensual por rubro/categoria |
          | \`agregado_anual_organismo_clean.parquet\` | Gasto anual por organismo y sector |
          | \`agregado_anual_region_clean.parquet\` | Gasto anual por region |
          | \`agregado_anual_proveedor_top500.parquet\` | Top 500 proveedores por año |
          | \`competencia_por_rubro.parquet\` | Nivel de competencia por rubro |
          | \`metricas_anuales_categoria.parquet\` | Metricas con indice de oportunidad |
          | \`sankey_tops_2024.json\` | Top 15 por nivel (año mas reciente disponible) |

          ### Uso en el proyecto de analisis

          Descargar los archivos y colocarlos en \`data/processed/\` del repositorio
          [chile-public-procurement-analysis](https://github.com/djwillichile/chile-public-procurement-analysis).
          EOF
          )

          gh release create "$TAG" \
            --title "Datos ChileCompra procesados $(date +%Y-%m-%d)" \
            --notes "$NOTES" \
            data/processed/*.parquet \
            data/processed/sankey_tops_2024.json
